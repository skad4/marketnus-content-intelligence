name: Actualización semanal (cada lunes)

on:
  schedule:
    # Lunes 07:17 UTC = 01:17 en Ciudad de México, 08:17 en Madrid
    - cron: "17 7 * * 1"
  workflow_dispatch: {}      # botón "Run workflow" en la pestaña Actions
  push:                      # también corre si cambias keywords o el pipeline
    branches: [main]
    paths: ["config/keywords.csv", "pipeline/**", ".github/workflows/**"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Recolectar datos (Google Trends, autocompletado, TikTok)
        run: python -m pipeline.run_weekly

      - name: Guardar datos en el repositorio
        run: |
          git config user.name "marketnus-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Datos semanales $(date -u +%F)"
          git push
